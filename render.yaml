# Render (plan gratis) + base de datos PostgreSQL externa gratuita (Neon). Las cuentas viven en Neon, no en Render.
services:
  - type: web
    name: gotta
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false   # Render te pedirá pegar aquí la cadena de conexión de Neon
      - key: TRUST_PROXY
        value: "1"
