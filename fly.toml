# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create data --size 1`, `fly deploy`
app = "gotta-CAMBIA-ESTE-NOMBRE"
primary_region = "mad"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
